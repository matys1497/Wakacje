    String(detail).replace(/&/g, "&amp;").replace(/</g, "&lt;") + '</pre>' +
    '<p style="font-size:14px;color:#968AA6;line-height:1.6;margin:0 0 10px"><b style="color:#F4EFE6">Co sprawdzić po kolei:</b></p>' +

    '<li>Czy plik wkleił się w całości? Ostatnia linia kodu musi kończyć się na <code>&lt;/html&gt;</code>.</li>' +
    '<li>Czy masz internet? Strona pobiera biblioteki z sieci przy pierwszym wejściu.</li>' +
    '<li>Czy otwierasz ją z adresu github.io, a nie z podglądu pliku? Podglądy często blokują skrypty zewnętrzne.</li>' +
    '</ol></div>';
};
window.addEventListener("error", function (e) {
  if (e.target && e.target.tagName === "SCRIPT") {
    window.__fail("Nie udało się pobrać bibliotek", "Nie wczytał się plik:\n" + (e.target.src || "?") + "\n\nSprawdź połączenie z internetem albo spróbuj na innej sieci.");
    return;
  }
  window.__fail("Błąd w kodzie strony", (e.message || "nieznany błąd") + (e.lineno ? "\nlinia " + e.lineno + ", znak " + e.colno : ""));
}, true);
</script>

<script type="text/babel" data-presets="react">
/* ==================================================================
   KONFIGURACJA — wklej tutaj dwie wartości z Supabase
   Settings -> API -> Project URL  oraz  anon public key
   ================================================================== */

const SUPABASE_URL = "https://poguosluiyglaawoclam.supabase.co";
const SUPABASE_KEY = "sb_publishable_feAu4W9xFbQeAe3ezkMrzQ_2MQK3HzN";
/* ================================================================== */

const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ---------- tokeny wizualne ---------- */
const C = {
  bg: "#15111A", panel: "#201A28", panel2: "#2A2333", line: "#372F44",
  ink: "#F4EFE6", dim: "#968AA6", gold: "#E9A13B", goldDim: "#3C2E1A",
  rose: "#DE6480", mint: "#63BC9F",
};
const PALETTE = ["#E9A13B", "#DE6480", "#63BC9F", "#8E9BF0", "#E3785C", "#C58BE0", "#6FBBD8", "#C9C05E"];
const FONT = "'Familjen Grotesk', system-ui, -apple-system, sans-serif";
const ETHANOL_G_PER_ML = 0.789;
const PORCJA_G = 10;
const POLL_MS = 12000;

const PORCJE = [
  { ml: 25, label: "mały shot" }, { ml: 40, label: "shot" }, { ml: 50, label: "kieliszek" },
  { ml: 100, label: "kreska" }, { ml: 150, label: "lampka" }, { ml: 200, label: "szklanka" },
  { ml: 330, label: "puszka" }, { ml: 500, label: "duże piwo" },
];

/* ---------- narzędzia ---------- */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const nowMs = () => Date.now();
const slug = (s) => (s || "").toLowerCase().trim().replace(/[^a-z0-9ąćęłńóśźż]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
const zl = (n) => (Math.round((n + Number.EPSILON) * 100) / 100).toFixed(2).replace(".", ",") + " zł";
const num = (n, d = 1) => n.toFixed(d).replace(".", ",");
const hhmm = (ts) => new Date(ts).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });
const dayLabel = (ts) => new Date(ts).toLocaleDateString("pl-PL", { day: "numeric", month: "short" });
const jitter = (seed) => (((seed * 9301 + 49297) % 233280) / 233280 - 0.5) * 9;
const buzz = (ms = 10) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const suggestPortion = (b) => {
  if (!b) return 100;
  const a = Number(b.abv) || 0;
  if (a >= 25) return 50;
  if (a >= 8) return 150;
  if (a > 0) return Math.min(500, Number(b.volume) || 330);
  return 100;
};
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ---------- warstwa danych (Supabase REST) ---------- */
const CONFIGURED = SUPABASE_URL.startsWith("http") && SUPABASE_KEY.length > 20 && !SUPABASE_KEY.startsWith("WKLEJ");
// Nowe klucze (sb_publishable_...) nie są JWT i idą wyłącznie w nagłówku apikey.
// Stare klucze anon (eyJ...) wymagają dodatkowo nagłówka Authorization.
const LEGACY_KEY = SUPABASE_KEY.startsWith("eyJ");
const H = LEGACY_KEY
  ? { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" }
  : { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
async function rest(path, opts = {}) {
  const res = await fetch(SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/" + path, {
    ...opts,
    headers: { ...H, ...(opts.headers || {}) },
  });
  if (!res.ok) throw new Error((await res.text()) || res.status);
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
const db = {
  async load(room) {
    const q = "rooms?name=eq." + encodeURIComponent(room) + "&select=name,mode,people(*),bottles(*),pours(*)";
    let rows = await rest(q);
    if (!rows || !rows.length) {
      await rest("rooms", { method: "POST", headers: { Prefer: "resolution=ignore-duplicates,return=minimal" }, body: JSON.stringify({ name: room }) });
      return { people: [], bottles: [], pours: [], mode: "full" };
    }
    const r = rows[0];
    return {
      mode: r.mode || "full",
      people: (r.people || []).sort((a, b) => (a.created_at < b.created_at ? -1 : 1)).map((p) => ({ id: p.id, name: p.name })),
      bottles: (r.bottles || []).sort((a, b) => (a.created_at < b.created_at ? -1 : 1))
        .map((b) => ({ id: b.id, name: b.name, volume: Number(b.volume), abv: Number(b.abv), price: Number(b.price), payer: b.payer })),
      pours: (r.pours || []).map((p) => ({ id: p.id, p: p.person, b: p.bottle, ml: Number(p.ml), ts: Date.parse(p.at) }))
        .sort((a, b) => a.ts - b.ts),
    };
  },
  addPerson: (room, p) => rest("people", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ id: p.id, room, name: p.name }) }),
  delPerson: (id) => rest("people?id=eq." + id, { method: "DELETE", headers: { Prefer: "return=minimal" } }),
  patchPerson: (id, patch) => rest("people?id=eq." + id, { method: "PATCH", headers: { Prefer: "return=minimal" }, body: JSON.stringify(patch) }),
  patchBottle: (id, patch) => rest("bottles?id=eq." + id, { method: "PATCH", headers: { Prefer: "return=minimal" }, body: JSON.stringify(patch) }),
  addBottle: (room, b) => rest("bottles", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ id: b.id, room, name: b.name, volume: b.volume, abv: b.abv, price: b.price, payer: b.payer || null }) }),
  delBottle: (id) => rest("bottles?id=eq." + id, { method: "DELETE", headers: { Prefer: "return=minimal" } }),
  addPour: (room, p) => rest("pours", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ id: p.id, room, person: p.p, bottle: p.b, ml: p.ml, at: new Date(p.ts).toISOString() }) }),
  delPour: (id) => rest("pours?id=eq." + id, { method: "DELETE", headers: { Prefer: "return=minimal" } }),
  clearPours: (room) => rest("pours?room=eq." + encodeURIComponent(room), { method: "DELETE", headers: { Prefer: "return=minimal" } }),
  setMode: (room, mode) => rest("rooms?name=eq." + encodeURIComponent(room), { method: "PATCH", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ mode }) }),
};

/* ---------- kreski ---------- */
function Tally({ count, color, scale = 1, wrap = false, max = 30 }) {
  const full = Math.floor(count + 0.001);
  const half = count - full >= 0.25;
  const total = Math.min(full, max);
  const groups = [];
  for (let i = 0; i < total; i += 5) groups.push(Math.min(5, total - i));
  const w = 26 * scale, h = 26 * scale;
  const strokes = (n, gi) => {
    const out = [];
    for (let i = 0; i < Math.min(n, 4); i++) {
      const x = 3 + i * 5.5;
      out.push(<line key={i} x1={x} y1={3} x2={x + jitter(gi * 7 + i) * 0.06} y2={22} stroke={color} strokeWidth={2.1} strokeLinecap="round" />);
    }
    if (n === 5) out.push(<line key="x" x1={0.5} y1={21} x2={22} y2={4} stroke={color} strokeWidth={2.1} strokeLinecap="round" />);
    return out;
  };
  if (!count) return <span style={{ color: C.dim, fontSize: 13 * scale }}>—</span>;
  return (
    <span style={{ display: "flex", flexWrap: wrap ? "wrap" : "nowrap", gap: 4 * scale, alignItems: "center", overflow: wrap ? "visible" : "hidden" }}>
      {groups.map((n, gi) => <svg key={gi} width={w} height={h} viewBox="0 0 24 25" style={{ flex: "0 0 auto" }}>{strokes(n, gi)}</svg>)}
      {half && <svg width={9 * scale} height={h} viewBox="0 0 8 25" style={{ flex: "0 0 auto" }}><line x1={4} y1={9} x2={4} y2={22} stroke={color} strokeWidth={2.1} strokeLinecap="round" opacity={0.75} /></svg>}
      {full > max && <span style={{ color: C.dim, fontSize: 12 * scale }}>+{full - max}</span>}
    </span>
  );
}

/* ---------- aplikacja ---------- */
function App() {
  const [room, setRoom] = useState(null);
  const [history, setHistory] = useState(() => lsGet("kreski:pokoje", []));
  const [state, setState] = useState({ people: [], bottles: [], pours: [], mode: "full" });
  const [tab, setTab] = useState("kreski");
  const [portion, setPortion] = useState(100);
  const [activeBottle, setActiveBottle] = useState(null);
  const [status, setStatus] = useState("idle");
  const [detail, setDetail] = useState(null);
  const stateRef = useRef(state);
  stateRef.current = state;
  const hold = useRef(0);
  const lastBottle = useRef(null);

  const refresh = useCallback(async (force) => {
    if (!room) return;
    if (!force && nowMs() < hold.current) return;
    try {
      const data = await db.load(room);
      if (nowMs() >= hold.current) { stateRef.current = data; setState(data); }
      setStatus("ok");
    } catch (e) { setStatus("err"); }
  }, [room]);

  useEffect(() => {
    if (!room) return;
    refresh(true);
    const t = setInterval(() => { if (document.visibilityState === "visible") refresh(false); }, POLL_MS);
    const onVis = () => { if (document.visibilityState === "visible") refresh(true); };
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(t); document.removeEventListener("visibilitychange", onVis); };
  }, [room, refresh]);

  /* optymistyczna zmiana + zapis */
  const act = async (local, remote) => {
    hold.current = nowMs() + 2500;
    const next = local(stateRef.current);
    stateRef.current = next;
    setState(next);
    setStatus("sync");
    try { await remote(); setStatus("ok"); } catch (e) { setStatus("err"); }
    hold.current = 0;
    refresh(true);
  };

  const enterRoom = (raw) => {
    const s = slug(raw);
    if (!s) return;
    const empty = { people: [], bottles: [], pours: [], mode: "full" };
    stateRef.current = empty;
    setState(empty);
    setActiveBottle(null);
    lastBottle.current = null;
    setTab("kreski");
    setRoom(s);
    const h = [{ name: s, ts: nowMs() }, ...history.filter((x) => x.name !== s)].slice(0, 8);
    setHistory(h); lsSet("kreski:pokoje", h);
  };
  const leaveRoom = () => {
    setRoom(null); setStatus("idle");
    const empty = { people: [], bottles: [], pours: [], mode: "full" };
    stateRef.current = empty; setState(empty);
  };
  const forget = (n) => { const h = history.filter((x) => x.name !== n); setHistory(h); lsSet("kreski:pokoje", h); };

  const people = state.people, bottles = state.bottles, pours = state.pours;
  const colorOf = useCallback((id) => PALETTE[Math.max(0, people.findIndex((p) => p.id === id)) % PALETTE.length], [people]);

  useEffect(() => {
    if (bottles.length && !bottles.some((b) => b.id === activeBottle)) setActiveBottle(bottles[bottles.length - 1].id);
    if (!bottles.length && activeBottle) setActiveBottle(null);
  }, [bottles, activeBottle]);

  useEffect(() => {
    if (!activeBottle || lastBottle.current === activeBottle) return;
    lastBottle.current = activeBottle;
    setPortion(suggestPortion(bottles.find((b) => b.id === activeBottle)));
  }, [activeBottle, bottles]);

  const addPerson = (name) => {
    const n = name.trim(); if (!n) return;
    const p = { id: uid(), name: n };
    act((s) => ({ ...s, people: [...s.people, p] }), () => db.addPerson(room, p));
  };
  const delPerson = (id) => act(
    (s) => ({ ...s, people: s.people.filter((x) => x.id !== id), pours: s.pours.filter((x) => x.p !== id) }),
    () => db.delPerson(id)
  );
  const renamePerson = (id, raw) => {
    const n = (raw || "").trim();
    if (!n) return;
    act((s) => ({ ...s, people: s.people.map((p) => (p.id === id ? { ...p, name: n } : p)) }), () => db.patchPerson(id, { name: n }));
  };
  const updateBottle = (id, patch) => act(
    (s) => ({ ...s, bottles: s.bottles.map((b) => (b.id === id ? { ...b, ...patch } : b)) }),
    () => db.patchBottle(id, { ...patch, payer: patch.payer || null })
  );
  const addBottle = (b) => {
    const nb = { ...b, id: uid() };
    act((s) => ({ ...s, bottles: [...s.bottles, nb] }), () => db.addBottle(room, nb));
  };
  const delBottle = (id) => act(
    (s) => ({ ...s, bottles: s.bottles.filter((x) => x.id !== id), pours: s.pours.filter((x) => x.b !== id) }),
    () => db.delBottle(id)
  );
  const pour = (personId) => {
    if (!activeBottle) return;
    buzz(12);
    const p = { id: uid(), p: personId, b: activeBottle, ml: portion, ts: nowMs() };
    act((s) => ({ ...s, pours: [...s.pours, p] }), () => db.addPour(room, p));
  };
  const unpour = (personId) => {
    const mine = pours.filter((x) => x.p === personId && x.b === activeBottle).sort((a, b) => b.ts - a.ts);
    if (!mine.length) return;
    buzz(6);
    const id = mine[0].id;
    act((s) => ({ ...s, pours: s.pours.filter((x) => x.id !== id) }), () => db.delPour(id));
  };
  const setMode = (m) => act((s) => ({ ...s, mode: m }), () => db.setMode(room, m));
  const resetPours = () => act((s) => ({ ...s, pours: [] }), () => db.clearPours(room));

  /* ---------- wyliczenia ---------- */
  const calc = useMemo(() => {
    const mlBy = {}, ethBy = {}, mlByBottle = {}, firstBy = {}, lastBy = {}, perBottleBy = {}, countBy = {};
    for (const p of pours) {
      mlBy[p.p] = (mlBy[p.p] || 0) + p.ml;
      countBy[p.p] = (countBy[p.p] || 0) + 1;
      mlByBottle[p.b] = mlByBottle[p.b] || {};
      mlByBottle[p.b][p.p] = (mlByBottle[p.b][p.p] || 0) + p.ml;
      perBottleBy[p.p] = perBottleBy[p.p] || {};
      perBottleBy[p.p][p.b] = (perBottleBy[p.p][p.b] || 0) + p.ml;
      if (!firstBy[p.p] || p.ts < firstBy[p.p]) firstBy[p.p] = p.ts;
      if (!lastBy[p.p] || p.ts > lastBy[p.p]) lastBy[p.p] = p.ts;
      const b = bottles.find((x) => x.id === p.b);
      const abv = b && Number(b.abv) > 0 ? Number(b.abv) : null;
      if (abv) ethBy[p.p] = (ethBy[p.p] || 0) + ((p.ml * abv) / 100) * ETHANOL_G_PER_ML;
    }
    const owed = {}, paid = {};
    for (const p of people) { owed[p.id] = 0; paid[p.id] = 0; }
    let spend = 0;
    for (const b of bottles) {
      const price = Number(b.price) || 0;
      spend += price;
      if (b.payer && paid[b.payer] !== undefined) paid[b.payer] += price;
      const per = mlByBottle[b.id] || {};
      const total = Object.values(per).reduce((a, c) => a + c, 0);
      if (state.mode === "full") {
        if (total > 0) {
          for (const k of Object.keys(per)) if (owed[k] !== undefined) owed[k] += (per[k] / total) * price;
        } else if (people.length) {
          for (const p of people) owed[p.id] += price / people.length;
        }
      } else {
        const vol = Number(b.volume) || 0;
        const perMl = vol > 0 ? price / vol : 0;
        for (const k of Object.keys(per)) if (owed[k] !== undefined) owed[k] += per[k] * perMl;
      }
    }
    const totalMl = Object.values(mlBy).reduce((a, c) => a + c, 0);
    const totalEth = Object.values(ethBy).reduce((a, c) => a + c, 0);
    const rows = people.map((p) => ({
      ...p,
      ml: mlBy[p.id] || 0, kreski: (mlBy[p.id] || 0) / 100, eth: ethBy[p.id] || 0, count: countBy[p.id] || 0,
      owed: owed[p.id] || 0, paid: paid[p.id] || 0, bal: (paid[p.id] || 0) - (owed[p.id] || 0),
      share: totalMl ? (mlBy[p.id] || 0) / totalMl : 0,
      first: firstBy[p.id] || null, last: lastBy[p.id] || null, byBottle: perBottleBy[p.id] || {},
    })).sort((a, b) => b.ml - a.ml);

    const debt = rows.filter((r) => r.bal < -0.005).map((r) => ({ name: r.name, id: r.id, v: -r.bal })).sort((a, b) => b.v - a.v);
    const cred = rows.filter((r) => r.bal > 0.005).map((r) => ({ name: r.name, id: r.id, v: r.bal })).sort((a, b) => b.v - a.v);
    const transfers = [];
    let i = 0, j = 0;
    while (i < debt.length && j < cred.length) {
      const v = Math.min(debt[i].v, cred[j].v);
      if (v > 0.01) transfers.push({ from: debt[i].name, to: cred[j].name, fromId: debt[i].id, toId: cred[j].id, v });
      debt[i].v -= v; cred[j].v -= v;
      if (debt[i].v <= 0.01) i++;
      if (cred[j].v <= 0.01) j++;
    }
    const unknownAbv = bottles.some((b) => !(Number(b.abv) > 0)) && pours.length > 0;
    return { rows, spend, totalMl, totalEth, transfers, mlByBottle, unknownAbv };
  }, [pours, people, bottles, state.mode]);

  if (!CONFIGURED) return <Setup />;
  if (!room) return <Start history={history} enterRoom={enterRoom} forget={forget} />;

  return (
    <div style={S.app}>
      <header style={S.header}>
        <button onClick={leaveRoom} style={{ ...S.ghost, textAlign: "left", padding: 0 }}>
          <div style={{ fontSize: 11, color: C.dim, letterSpacing: "0.06em" }}>pokój · zmień</div>
          <div style={{ fontSize: 17, fontWeight: 600, letterSpacing: "-0.01em", color: C.ink }}>{room}</div>
        </button>
        <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
          <span style={{ width: 7, height: 7, borderRadius: 99, background: status === "err" ? C.rose : status === "sync" ? C.gold : C.mint }} />
          <span style={{ fontSize: 12, color: C.dim }}>{status === "err" ? "brak połączenia" : status === "sync" ? "zapisuję" : "na bieżąco"}</span>
        </div>
      </header>

      <main style={{ padding: "0 16px 100px" }}>
        {tab === "kreski" && <Kreski {...{ people, bottles, pours, activeBottle, setActiveBottle, portion, setPortion, pour, unpour, addPerson, colorOf, renamePerson }} removePerson={delPerson} goBottles={() => setTab("butelki")} openDetail={setDetail} />}
        {tab === "butelki" && <Butelki bottles={bottles} people={people} addBottle={addBottle} removeBottle={delBottle} updateBottle={updateBottle} mlByBottle={calc.mlByBottle} colorOf={colorOf} />}
        {tab === "staty" && <Statystyki calc={calc} pours={pours} colorOf={colorOf} openDetail={setDetail} />}
        {tab === "kasa" && <Rozliczenie calc={calc} mode={state.mode} setMode={setMode} colorOf={colorOf} room={room} pours={pours} resetPours={resetPours} />}
      </main>

      {detail && <Detail row={calc.rows.find((r) => r.id === detail)} bottles={bottles} color={colorOf(detail)} onClose={() => setDetail(null)} />}

      <nav style={S.nav}>
        {[["kreski", "Kreski"], ["butelki", "Butelki"], ["staty", "Statystyki"], ["kasa", "Rozliczenie"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} style={{ ...S.navBtn, color: tab === k ? C.ink : C.dim, borderTop: "2px solid " + (tab === k ? C.gold : "transparent") }}>{label}</button>
        ))}
      </nav>
    </div>
  );
}

  useEffect(() => { setV(p.name); }, [p.name]);
  const save = () => {
    const n = v.trim();
    if (n && n !== p.name) onRename(p.id, n);
    else setV(p.name);
  };
  if (ask) return (
    <div style={{ ...S.card, borderLeft: "3px solid " + C.rose }}>

/* ---------- zakładka: statystyki ---------- */
function Statystyki({ calc, pours, colorOf, openDetail }) {
  const { rows, totalMl, totalEth, unknownAbv } = calc;
  const active = rows.filter((r) => r.ml > 0);
  if (!pours.length) return <div style={S.empty}>Statystyki pojawią się po pierwszej kresce.</div>;

  const t0 = pours[0].ts;
  const t1 = Math.max(pours[pours.length - 1].ts, t0 + 60000);
  const spanH = (t1 - t0) / 3600000;
  const W = 340, H = 200, PL = 34, PR = 10, PT = 12, PB = 22;
  const cum = {}, series = {};
  for (const p of pours) {
    cum[p.p] = (cum[p.p] || 0) + p.ml;
    (series[p.p] = series[p.p] || []).push({ t: p.ts, v: cum[p.p] });
  }
  const maxV = Math.max(100, ...Object.values(cum));
  const x = (t) => PL + ((t - t0) / (t1 - t0)) * (W - PL - PR);
  const y = (v) => H - PB - (v / maxV) * (H - PT - PB);
  const path = (pts) => {
    let d = "M " + x(t0) + " " + y(0), prev = 0;
    for (const pt of pts) { d += " L " + x(pt.t) + " " + y(prev) + " L " + x(pt.t) + " " + y(pt.v); prev = pt.v; }
    return d + " L " + x(t1) + " " + y(prev);
  };
  const grid = [0, 0.5, 1].map((f) => Math.round(maxV * f));

  const bucketMs = spanH > 5 ? 3600000 : 1800000;
  const nB = Math.max(1, Math.ceil((t1 - t0) / bucketMs));
  const buckets = new Array(nB).fill(0);
  for (const p of pours) buckets[Math.min(nB - 1, Math.floor((p.ts - t0) / bucketMs))] += p.ml;
  const maxB = Math.max(...buckets, 1);
  const peak = buckets.indexOf(maxB);

  const badges = [];
  const firstP = rows.filter((r) => r.first).sort((a, b) => a.first - b.first)[0];
  if (firstP) badges.push(["Otworzył(a) wieczór", firstP.name, firstP.id, hhmm(firstP.first)]);
  const lastP = rows.filter((r) => r.last).sort((a, b) => b.last - a.last)[0];
  if (lastP && firstP && lastP.id !== firstP.id) badges.push(["Ostatni(a) na nogach", lastP.name, lastP.id, hhmm(lastP.last)]);
  const marathon = active.map((r) => ({ ...r, span: (r.last - r.first) / 3600000 })).sort((a, b) => b.span - a.span)[0];
  if (marathon && marathon.span > 0.5) badges.push(["Najdłuższy dystans", marathon.name, marathon.id, num(marathon.span, 1) + " h"]);
  const explorer = active.map((r) => ({ ...r, n: Object.keys(r.byBottle).length })).sort((a, b) => b.n - a.n)[0];
  if (explorer && explorer.n > 1) badges.push(["Spróbował(a) wszystkiego", explorer.name, explorer.id, explorer.n + " butelki"]);
  const calm = active.filter((r) => r.count > 2).map((r) => ({ ...r, rate: r.ml / Math.max(0.5, (r.last - r.first) / 3600000) })).sort((a, b) => a.rate - b.rate)[0];
  if (calm) badges.push(["Najspokojniejsze tempo", calm.name, calm.id, num(calm.rate / 100, 1) + " kr/h"]);

  return (
    <>
      <div style={{ ...S.card, marginTop: 14, display: "flex", gap: 14 }}>
        <Stat big={num(totalMl / 100, totalMl % 100 ? 1 : 0)} label="kresek" accent />
        <Stat big={num(totalMl / 1000, 2)} label="litry napoju" />
        <Stat big={totalEth ? num(totalEth / 1000, 2) : "—"} label="litry czystego alk." />
      </div>
      {unknownAbv && <p style={{ fontSize: 12, color: C.dim, marginTop: 8 }}>Część butelek nie ma wpisanych procentów, więc czysty alkohol jest zaniżony.</p>}

      <h2 style={S.h2}>Jak to szło w czasie</h2>
      <div style={S.card}>
        <svg viewBox={"0 0 " + W + " " + H} width="100%" style={{ display: "block" }}>
          {grid.map((g, i) => (
            <g key={i}>
              <line x1={PL} y1={y(g)} x2={W - PR} y2={y(g)} stroke={C.line} strokeWidth="1" />
              <text x={PL - 6} y={y(g) + 3.5} textAnchor="end" fill={C.dim} fontSize="9" fontFamily={FONT}>{g}</text>
            </g>
          ))}
          {active.map((r) => <path key={r.id} d={path(series[r.id] || [])} fill="none" stroke={colorOf(r.id)} strokeWidth="2" strokeLinejoin="round" opacity="0.95" />)}
          {active.map((r) => { const s = series[r.id]; return s ? <circle key={r.id} cx={x(t1)} cy={y(s[s.length - 1].v)} r="3" fill={colorOf(r.id)} /> : null; })}
          <text x={PL} y={H - 6} fill={C.dim} fontSize="9" fontFamily={FONT}>{hhmm(t0)}</text>
          <text x={W - PR} y={H - 6} textAnchor="end" fill={C.dim} fontSize="9" fontFamily={FONT}>{hhmm(t1)}</text>
        </svg>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginTop: 8 }}>
          {active.map((r) => (
            <span key={r.id} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: C.dim }}>
              <span style={{ width: 8, height: 8, borderRadius: 99, background: colorOf(r.id) }} />{r.name}
            </span>
          ))}
        </div>
        <div style={{ fontSize: 12, color: C.dim, marginTop: 6 }}>skumulowane ml na osobę</div>
      </div>

      <h2 style={S.h2}>Tempo</h2>
      <div style={S.card}>
        <svg viewBox="0 0 340 90" width="100%" style={{ display: "block" }}>
          {buckets.map((v, i) => {
            const bw = 340 / nB, h = (v / maxB) * 66;
            return <rect key={i} x={i * bw + 1.5} y={72 - h} width={Math.max(1, bw - 3)} height={h} rx="2" fill={i === peak ? C.gold : C.goldDim} />;
          })}
          <text x="0" y="86" fill={C.dim} fontSize="9" fontFamily={FONT}>{hhmm(t0)}</text>
          <text x="340" y="86" textAnchor="end" fill={C.dim} fontSize="9" fontFamily={FONT}>{hhmm(t1)}</text>
        </svg>
        <div style={{ fontSize: 13, color: C.dim, marginTop: 6 }}>
          Najmocniej szło między {hhmm(t0 + peak * bucketMs)} a {hhmm(t0 + (peak + 1) * bucketMs)} — {num(maxB / 100, 1)} kreski.
        </div>
      </div>

      {!!badges.length && (
        <>
          <h2 style={S.h2}>Odznaki</h2>
          <div style={{ display: "grid", gap: 8 }}>
            {badges.map((b, i) => (
              <div key={i} style={{ ...S.card, display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 14px" }}>
                <div>
                  <div style={{ fontSize: 13, color: C.dim }}>{b[0]}</div>
                  <div style={{ fontSize: 16, fontWeight: 600, color: colorOf(b[2]) }}>{b[1]}</div>
                </div>
                <div style={{ fontSize: 13, color: C.dim, fontVariantNumeric: "tabular-nums" }}>{b[3]}</div>
              </div>
            ))}
          </div>
        </>
      )}

      <h2 style={S.h2}>Kto ile</h2>
      <div style={{ display: "grid", gap: 10 }}>
        {active.map((r) => (
          <button key={r.id} onClick={() => openDetail(r.id)} style={{ ...S.card, textAlign: "left", cursor: "pointer", borderLeft: "3px solid " + colorOf(r.id), color: C.ink }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <span style={{ fontSize: 16, fontWeight: 600 }}>{r.name}</span>
              <span style={{ fontSize: 13, color: C.dim, fontVariantNumeric: "tabular-nums" }}>
                {Math.round(r.share * 100)}% · {r.ml} ml{r.eth ? " · " + num(r.eth, 0) + " g" : ""}
              </span>
            </div>
            <div style={{ marginTop: 8 }}><Tally count={r.kreski} color={colorOf(r.id)} scale={0.85} wrap max={20} /></div>
          </button>
        ))}
      </div>

      <h2 style={S.h2}>Udział w butelkach</h2>
      <div style={{ display: "flex", height: 14, overflow: "hidden", borderRadius: 99, background: C.panel2 }}>
        {active.map((r) => <div key={r.id} style={{ width: r.share * 100 + "%", background: colorOf(r.id) }} />)}
      </div>
      <div style={{ height: 8 }} />
    </>
  );
}

function Stat({ big, label, accent }) {
  return (
    <div style={{ flex: 1 }}>
      <div style={{ fontSize: 26, fontWeight: 700, letterSpacing: "-0.02em", fontVariantNumeric: "tabular-nums", color: accent ? C.gold : C.ink }}>{big}</div>
      <div style={{ fontSize: 12, color: C.dim, marginTop: 2, lineHeight: 1.3 }}>{label}</div>
    </div>
  );
}

/* ---------- karta osoby ---------- */
function Detail({ row, bottles, color, onClose }) {
  if (!row) return null;
  const span = row.first && row.last ? (row.last - row.first) / 3600000 : 0;
  const tempo = span > 0.25 ? row.ml / span : null;
  const byBottle = Object.keys(row.byBottle).map((k) => [k, row.byBottle[k]]).sort((a, b) => b[1] - a[1]);
  const maxB = Math.max(1, ...byBottle.map((b) => b[1]));
  return (
    <div style={S.backdrop} onClick={onClose}>
      <div style={S.sheet} onClick={(e) => e.stopPropagation()}>
        <div style={{ width: 36, height: 4, borderRadius: 99, background: C.line, margin: "0 auto 16px" }} />
        <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
          <span style={{ width: 10, height: 10, borderRadius: 99, background: color }} />
          <h2 style={{ fontSize: 24, fontWeight: 700, margin: 0, letterSpacing: "-0.02em" }}>{row.name}</h2>
        </div>
        <div style={{ margin: "18px 0 6px" }}><Tally count={row.kreski} color={color} scale={1.05} wrap max={60} /></div>
        <div style={{ display: "flex", gap: 14, marginTop: 18 }}>
          <Stat big={num(row.kreski, row.ml % 100 ? 1 : 0)} label="kreski" accent />
          <Stat big={String(row.ml)} label="ml napoju" />
          <Stat big={row.eth ? num(row.eth, 0) : "—"} label="g czystego alk." />
        </div>
        {!!row.eth && (
          <p style={{ fontSize: 13, color: C.dim, marginTop: 12, lineHeight: 1.5 }}>
            Około {num(row.eth / PORCJA_G, 1)} porcji standardowych. Jedna porcja to 10 g czystego alkoholu, czyli mniej więcej małe piwo albo kieliszek wódki.
          </p>
        )}
        <div style={{ display: "grid", gap: 10, marginTop: 18 }}>
          <Line k="Do zapłaty" v={zl(row.owed)} />
          <Line k="Wyłożył(a)" v={zl(row.paid)} />
          <Line k={row.bal >= 0 ? "Dostaje" : "Oddaje"} v={zl(Math.abs(row.bal))} color={row.bal >= 0 ? C.mint : C.rose} />
          {row.first && <Line k="Pierwsza kreska" v={hhmm(row.first)} />}
          {row.last && <Line k="Ostatnia kreska" v={hhmm(row.last)} />}
          {tempo && <Line k="Tempo" v={num(tempo / 100, 1) + " kreski / h"} />}
          <Line k="Liczba nalań" v={String(row.count)} />
        </div>
        {!!byBottle.length && (
          <>
            <h3 style={{ ...S.h2, marginBottom: 10 }}>Z czego pił(a)</h3>
            <div style={{ display: "grid", gap: 10 }}>
              {byBottle.map(([bid, ml]) => {
                const b = bottles.find((x) => x.id === bid);
                return (
                  <div key={bid}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                      <span>{b ? b.name : "usunięta butelka"}</span>
                      <span style={{ color: C.dim, fontVariantNumeric: "tabular-nums" }}>{ml} ml</span>
                    </div>
                    <div style={{ ...S.barTrack, marginTop: 5 }}>
                      <div style={{ height: "100%", width: (ml / maxB) * 100 + "%", background: color, borderRadius: 99 }} />
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}
        <button onClick={onClose} style={{ ...S.primary, width: "100%", marginTop: 24 }}>Zamknij</button>
        <div style={{ height: 12 }} />
      </div>
    </div>
  );
}

function Line({ k, v, color }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 15, borderBottom: "1px solid " + C.line, paddingBottom: 8 }}>
      <span style={{ color: C.dim }}>{k}</span>
      <span style={{ fontWeight: 600, color: color || C.ink, fontVariantNumeric: "tabular-nums" }}>{v}</span>
    </div>
  );
}

/* ---------- zakładka: rozliczenie ---------- */
function Rozliczenie({ calc, mode, setMode, colorOf, room, pours, resetPours }) {
  const { rows, spend, totalMl, transfers } = calc;
  const [copied, setCopied] = useState(false);
  const [confirm, setConfirm] = useState(false);
  const summary = () => {
    const L = ["Rozliczenie — " + room, "Wydane: " + zl(spend) + " · " + num(totalMl / 100, 1) + " kresek", ""];
    rows.forEach((r) => L.push(r.name + ": " + num(r.kreski, 1) + " kr — " + zl(r.owed) + (r.paid > 0 ? " (wyłożył " + zl(r.paid) + ")" : "")));
    L.push("", "Kto komu:");
    if (transfers.length) transfers.forEach((t) => L.push(t.from + " → " + t.to + ": " + zl(t.v)));
    else L.push("nikt nikomu nic");
    return L.join("\n");
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(summary()); setCopied(true); setTimeout(() => setCopied(false), 2200); }
    catch (e) { setCopied("err"); }
  };
  return (
    <>
      <div style={{ ...S.card, marginTop: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
          <div>
            <div style={{ fontSize: 34, fontWeight: 700, letterSpacing: "-0.03em", fontVariantNumeric: "tabular-nums", color: C.gold }}>{zl(spend)}</div>
            <div style={{ fontSize: 13, color: C.dim }}>wydane na alkohol</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 20, fontWeight: 600, fontVariantNumeric: "tabular-nums" }}>{totalMl ? zl(spend / (totalMl / 100)) : "—"}</div>
            <div style={{ fontSize: 13, color: C.dim }}>za kreskę</div>
          </div>
        </div>
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
        {[["full", "Dzielimy całe butelki"], ["poured", "Płacimy za wypite"]].map(([k, label]) => (
          <button key={k} onClick={() => setMode(k)} style={{ ...S.chip, flex: 1, fontSize: 13, background: mode === k ? C.goldDim : "transparent", borderColor: mode === k ? C.gold : C.line, color: mode === k ? C.gold : C.dim }}>{label}</button>
        ))}
      </div>
      <p style={{ fontSize: 13, color: C.dim, marginTop: 8, lineHeight: 1.55 }}>
        {mode === "full"
          ? "Koszt otwartej butelki rozkłada się na tych, którzy z niej pili, proporcjonalnie do kresek. Resztka w butelce też jest opłacona."
          : "Każdy płaci tylko za mililitry, które sobie nalał. Za niedopitą resztę płaci ten, kto kupił."}
      </p>

      <h2 style={S.h2}>Rachunek na osobę</h2>
      <div style={{ display: "grid", gap: 8 }}>
        {rows.map((r) => (
          <div key={r.id} style={{ ...S.card, borderLeft: "3px solid " + colorOf(r.id) }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <span style={{ fontWeight: 600, fontSize: 16 }}>{r.name}</span>
              <span style={{ fontVariantNumeric: "tabular-nums", fontWeight: 600 }}>{zl(r.owed)}</span>
            </div>
            <div style={{ fontSize: 13, color: C.dim, marginTop: 3, fontVariantNumeric: "tabular-nums" }}>
              {num(r.kreski, 1)} kreski · wyłożył(a) {zl(r.paid)}
            </div>
          </div>
        ))}
        {!rows.length && <div style={S.empty}>Jeszcze nikogo tu nie ma.</div>}
      </div>

      <h2 style={S.h2}>Kto komu oddaje</h2>
      <div style={{ display: "grid", gap: 8 }}>
        {transfers.map((t, i) => (
          <div key={i} style={{ ...S.card, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontSize: 15 }}>
              <span style={{ fontWeight: 600, color: colorOf(t.fromId) }}>{t.from}</span>
              <span style={{ color: C.dim }}> oddaje </span>
              <span style={{ fontWeight: 600, color: colorOf(t.toId) }}>{t.to}</span>
            </div>
            <div style={{ fontWeight: 700, fontVariantNumeric: "tabular-nums" }}>{zl(t.v)}</div>
          </div>
        ))}
        {!transfers.length && <div style={S.empty}>Nikt nikomu nic nie jest winien.</div>}
      </div>

      <button onClick={copy} style={{ ...S.primary, width: "100%", marginTop: 16, background: copied === true ? C.mint : C.gold }}>
        {copied === true ? "Skopiowane" : copied === "err" ? "Nie udało się skopiować" : "Kopiuj podsumowanie"}
      </button>

      {!!pours.length && (
        <div style={{ marginTop: 22, textAlign: "center" }}>
          {confirm ? (
            <div style={{ ...S.card, textAlign: "left" }}>
              <div style={{ fontSize: 14, lineHeight: 1.5 }}>Skasować wszystkie kreski? Osoby i butelki zostaną. Tego nie da się cofnąć.</div>
              <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                <button onClick={() => { resetPours(); setConfirm(false); }} style={{ ...S.primary, background: C.rose, color: "#fff", flex: 1 }}>Kasuj</button>
                <button onClick={() => setConfirm(false)} style={{ ...S.chip, flex: 1, color: C.dim }}>Zostaw</button>
              </div>
            </div>
          ) : <button onClick={() => setConfirm(true)} style={{ ...S.ghost, fontSize: 13 }}>Nowa impreza — wyzeruj kreski</button>}
        </div>
      )}
      <div style={{ height: 20 }} />
    </>
  );
}

/* ---------- style ---------- */
const S = {
  app: { fontFamily: FONT, background: C.bg, color: C.ink, minHeight: "100vh", maxWidth: 520, margin: "0 auto", position: "relative" },
  header: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 16px 10px" },
  h1: { fontSize: 40, fontWeight: 700, lineHeight: 1, margin: 0, letterSpacing: "-0.035em" },
  h2: { fontSize: 13, fontWeight: 600, color: C.dim, margin: "26px 0 10px", letterSpacing: "0.04em" },
  card: { background: C.panel, border: "1px solid " + C.line, borderRadius: 16, padding: 14 },
  row: { display: "flex", alignItems: "center", gap: 10, background: C.panel, border: "1px solid " + C.line, borderRadius: 16, padding: "12px 12px 12px 14px" },
  plus: { width: 58, height: 54, borderRadius: 14, border: "none", background: C.gold, color: "#1B1410", fontSize: 26, fontWeight: 600, cursor: "pointer", fontFamily: FONT, flex: "0 0 auto" },
  minus: { width: 42, height: 54, borderRadius: 14, border: "1px solid " + C.line, background: "transparent", color: C.dim, fontSize: 20, cursor: "pointer", fontFamily: FONT, flex: "0 0 auto" },
  primary: { background: C.gold, color: "#1B1410", border: "none", borderRadius: 14, padding: "13px 18px", fontSize: 15, fontWeight: 600, cursor: "pointer", fontFamily: FONT },
  ghost: { background: "transparent", border: "none", color: C.dim, fontSize: 14, cursor: "pointer", fontFamily: FONT },
  input: { background: C.panel2, border: "1px solid " + C.line, borderRadius: 14, padding: "13px 14px", color: C.ink, fontSize: 16, width: "100%", fontFamily: FONT },
  chip: { border: "1px solid " + C.line, borderRadius: 99, padding: "8px 14px", fontSize: 14, cursor: "pointer", whiteSpace: "nowrap", fontFamily: FONT, background: "transparent" },
  scroller: { display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4, scrollbarWidth: "none" },
  empty: { color: C.dim, fontSize: 14, lineHeight: 1.55, padding: "24px 0", textAlign: "center" },
  barTrack: { height: 7, background: C.panel2, borderRadius: 99, marginTop: 10, overflow: "hidden" },
  backdrop: { position: "fixed", inset: 0, background: "rgba(8,6,11,0.72)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 },
  sheet: { background: C.panel, width: "100%", maxWidth: 520, maxHeight: "88vh", overflowY: "auto", borderRadius: "22px 22px 0 0", padding: "12px 18px 18px", border: "1px solid " + C.line, animation: "riseIn 220ms ease-out" },
  nav: { position: "fixed", bottom: 0, left: 0, right: 0, maxWidth: 520, margin: "0 auto", display: "flex", background: "rgba(21,17,26,0.97)", borderTop: "1px solid " + C.line, backdropFilter: "blur(8px)" },
  navBtn: { flex: 1, padding: "13px 0 20px", background: "transparent", border: "none", fontSize: 12, cursor: "pointer", fontFamily: FONT },
};

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  window.__fail("Aplikacja się nie uruchomiła", (e && e.message) || String(e));
}
</script>
</body>
</html>
